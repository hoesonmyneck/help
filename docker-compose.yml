services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cbdi
      POSTGRES_USER: cbdi
      POSTGRES_PASSWORD: cbdi123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbdi"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cbdi:cbdi123@db:5432/cbdi
      # В проде задать сильные значения (см. .env / окружение сервера):
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-9f3a2b7c1d8e4f60}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-crtr2026}
      # Постоянный токен для перехода с портала ecosystem.enbek.kz:
      SSO_TOKEN: ${SSO_TOKEN:-}
      # Внешний адрес сервиса для абсолютной ссылки redirectUrl в SSO-ответе:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://interaction.enbek.kz:8443}
    volumes:
      - ./backend/static:/app/static

  caddy:
    image: caddy:2-alpine
    ports:
      - "8083:80"     # http  → http://interaction.enbek.kz:8083
      - "8443:443"    # https → https://interaction.enbek.kz:8443 (для ЭЦП/NCALayer)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro   # боевой сертификат *.enbek.kz (в git не хранится)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
